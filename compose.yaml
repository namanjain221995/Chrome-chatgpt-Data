# Local development and PostgreSQL integration stack. Object-storage tests use
# botocore stubs; optional manual tests use the real AWS API and an isolated key
# prefix. No object-storage server is part of this stack.
name: techsara-chat-archive

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  APP_NAME: techsara-chat-archive
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
  API_BASE_PATH: /api/v1
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-techsara_app}:${POSTGRES_PASSWORD:-devonly_change_me}@postgres:5432/${POSTGRES_DB:-techsara_chat_archive}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
  AWS_REGION: us-east-1
  S3_BUCKET: techsara-chatgpt
  S3_ENDPOINT_URL: ""
  S3_USE_PATH_STYLE: "false"
  OIDC_ISSUER: ${OIDC_ISSUER:-https://accounts.google.com}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-replace-me}
  OIDC_REQUIRED_HD: ${OIDC_REQUIRED_HD:-example.com}
  ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-example.com}
  EXTENSION_IDS: ${EXTENSION_IDS:-}
  JWT_SECRET: ${JWT_SECRET:-devonly_insecure_signing_key_change_me}
  CONFIG_SIGNING_KEY: ${CONFIG_SIGNING_KEY:-devonly_insecure_config_key_change_me}
  DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-true}
  MANAGED_WORKSPACE_LABEL: ${MANAGED_WORKSPACE_LABEL:-TechSara's Workspace}
  MANAGED_WORKSPACE_IDS: ${MANAGED_WORKSPACE_IDS:-}
  BROWSER_CONTENT_CAPTURE_ENABLED: ${BROWSER_CONTENT_CAPTURE_ENABLED:-false}
  OPENAI_WRITTEN_AUTHORIZATION_CONFIRMED: ${OPENAI_WRITTEN_AUTHORIZATION_CONFIRMED:-false}
  TRAINING_EXPORT_ENABLED: ${TRAINING_EXPORT_ENABLED:-false}
  COMPLIANCE_POLL_ENABLED: ${COMPLIANCE_POLL_ENABLED:-false}
  LOG_MESSAGE_CONTENT: "false"
  API_WORKERS: ${API_WORKERS:-2}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}

x-app-service: &app-service
  build:
    context: ./services/backend
    dockerfile: Dockerfile
    args:
      GIT_SHA: ${GIT_SHA:-dev}
  image: ${IMAGE_NAME:-techsara-chat-archive-backend}:${IMAGE_TAG:-local}
  environment: *app-env
  networks: [backend, egress]
  logging: *default-logging
  read_only: true
  tmpfs: ["/tmp:size=128m"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techsara_chat_archive}
      POSTGRES_USER: ${POSTGRES_USER:-techsara_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonly_change_me}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: UTC
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - wal_compression=on
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techsara_app} -d ${POSTGRES_DB:-techsara_chat_archive}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend]
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]

  migrate:
    <<: *app-service
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  worker:
    <<: *app-service
    restart: unless-stopped
    command: ["python", "-m", "app.workers.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    stop_grace_period: 60s

  compliance-poller:
    <<: *app-service
    profiles: [compliance]
    restart: unless-stopped
    command: ["python", "-m", "app.workers.compliance_poller"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  backup:
    <<: *app-service
    profiles: [backup]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/scripts/backup_loop.sh"]
    environment:
      <<: *app-env
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-techsara_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:-devonly_change_me}
      PGDATABASE: ${POSTGRES_DB:-techsara_chat_archive}
    volumes:
      - ./scripts:/opt/scripts:ro
      - backup-work:/var/backups/techsara
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  pgadmin:
    image: dpage/pgadmin4:8.14
    profiles: [admin]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-dba@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-devonly_change_me}
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]

networks:
  backend:
    driver: bridge
    internal: true
  egress:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
  backup-work:
