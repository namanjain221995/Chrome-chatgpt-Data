name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_real_s3:
        description: Run the explicitly authorized AWS S3 prefix test
        required: true
        default: false
        type: boolean
      test_s3_prefix:
        description: Dedicated prefix beginning with integration-tests/
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - name: Install backend
        working-directory: services/backend
        run: pip install -e ".[dev]"
      - name: Ruff
        working-directory: services/backend
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: mypy
        working-directory: services/backend
        env:
          ENVIRONMENT: test
        run: mypy app
      - name: Unit tests
        working-directory: services/backend
        env:
          ENVIRONMENT: test
          AWS_REGION: us-east-1
          S3_BUCKET: techsara-chatgpt
        run: pytest -q -m "not integration and not real_s3" --cov=app --cov-report=term-missing

  extension:
    name: Extension lint, types, tests and deterministic build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/chrome-extension/package-lock.json
      - name: Install extension
        working-directory: apps/chrome-extension
        run: npm ci --no-audit --no-fund
      - name: Lint, typecheck and test
        working-directory: apps/chrome-extension
        run: |
          npm run lint
          npm run typecheck
          npm run test
      - name: Build and validate Manifest V3
        working-directory: apps/chrome-extension
        run: |
          npm run build
          npm run validate:manifest
          npm run validate:schemas
      - name: Package twice and compare
        working-directory: apps/chrome-extension
        run: |
          npm run package
          first="$(sha256sum ../../artifacts/*.zip | awk '{print $1}')"
          npm run package >/dev/null
          second="$(sha256sum ../../artifacts/*.zip | awk '{print $1}')"
          test "$first" = "$second"
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          retention-days: 30

  postgres:
    name: PostgreSQL integration, migrations and restore
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: techsara_app
          POSTGRES_PASSWORD: devonly_change_me
          POSTGRES_DB: techsara_chat_archive
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U techsara_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DEV_AUTH_ENABLED: "true"
      BROWSER_CONTENT_CAPTURE_ENABLED: "true"
      OPENAI_WRITTEN_AUTHORIZATION_CONFIRMED: "true"
      MANAGED_WORKSPACE_LABEL: "TechSara's Workspace"
      ALLOWED_EMAIL_DOMAINS: example.com
      OIDC_CLIENT_ID: test-client-id
      OIDC_REQUIRED_HD: example.com
      AWS_REGION: us-east-1
      S3_BUCKET: techsara-chatgpt
      DATABASE_URL: postgresql+asyncpg://techsara_app:devonly_change_me@localhost:5432/techsara_chat_archive
      TEST_DATABASE_URL: postgresql+asyncpg://techsara_app:devonly_change_me@localhost:5432/techsara_chat_archive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - name: Install backend
        working-directory: services/backend
        run: pip install -e ".[dev]"
      - name: Empty upgrade and drift check
        working-directory: services/backend
        run: |
          alembic upgrade head
          alembic check
      - name: Integration tests
        working-directory: services/backend
        run: pytest -q -m integration
      - name: Downgrade and re-upgrade
        working-directory: services/backend
        run: |
          alembic downgrade -1
          alembic upgrade head
          alembic check
      - name: Backup and restore
        run: |
          PGPASSWORD=devonly_change_me pg_dump -h localhost -U techsara_app \
            -d techsara_chat_archive -Fc > /tmp/archive.dump
          test -s /tmp/archive.dump
          PGPASSWORD=devonly_change_me createdb -h localhost -U techsara_app restore_check
          PGPASSWORD=devonly_change_me pg_restore -h localhost -U techsara_app \
            -d restore_check --no-owner /tmp/archive.dump
          tables="$(PGPASSWORD=devonly_change_me psql -h localhost -U techsara_app \
            -d restore_check -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")"
          test "$tables" -ge 25

  configuration:
    name: Images, Compose and production guards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: services/backend
          push: false
          load: true
          tags: techsara/chat-archive-backend:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image is non-root
        run: |
          test "$(docker run --rm --entrypoint id techsara/chat-archive-backend:ci -u)" != "0"
          test "$(docker run --rm --entrypoint pg_dump techsara/chat-archive-backend:ci --version | awk '{print $3}' | cut -d. -f1)" = "16"
          docker tag techsara/chat-archive-backend:ci techsara/chat-archive-backend:local
      - name: Compose topology and production S3 guards
        run: |
          docker compose -f compose.yaml config --quiet
          bash scripts/verify_production_config.sh
      - name: Shell syntax and static analysis
        run: make lint-shell lint-workflows
      - name: Production secret and private-service smoke
        run: bash tests/integration/production_compose_smoke_test.sh
      - name: Compose PostgreSQL, API, worker, backup and restore smoke
        run: bash tests/integration/compose_smoke_test.sh
      - name: Short k6 ingestion smoke
        run: bash tests/load/run_smoke.sh

  schemas:
    name: Shared schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/chrome-extension/package-lock.json
      - run: pip install -e "services/backend[dev]"
      - run: npm ci --no-audit --no-fund
        working-directory: apps/chrome-extension
      - name: Regenerate and compare
        env:
          ENVIRONMENT: test
        run: |
          python scripts/generate_schemas.py
          git diff --exit-code -- packages/schemas
      - run: node scripts/validate-schemas.mjs
        working-directory: apps/chrome-extension

  security:
    name: Secrets, dependencies and prohibited technology
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repository policy checks
        run: |
          bash scripts/verify_removed_technologies.sh
          bash scripts/verify_no_prohibited_aws_services.sh
          bash scripts/secret_scan.sh
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - name: Python dependency audit
        working-directory: services/backend
        run: |
          pip install -e ".[dev]"
          pip-audit --local --skip-editable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/chrome-extension/package-lock.json
      - name: Node dependency audit
        working-directory: apps/chrome-extension
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high --omit=dev

  docs-and-bundle:
    name: Documentation and deployment bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Documentation completeness
        run: bash scripts/docs_check.sh
      - name: Build deterministic bundle twice
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          bash scripts/deploy_bundle.sh
          first="$(sha256sum artifacts/*.tar.gz | awk '{print $1}')"
          bash scripts/deploy_bundle.sh >/dev/null
          second="$(sha256sum artifacts/*.tar.gz | awk '{print $1}')"
          test "$first" = "$second"
      - uses: actions/upload-artifact@v4
        with:
          name: ec2-deployment-bundle
          path: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
          retention-days: 30

  real-s3:
    name: Explicit real S3 prefix test
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_s3 == true && inputs.test_s3_prefix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_S3_TEST_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
        working-directory: services/backend
      - name: Prefix-scoped round trip
        working-directory: services/backend
        env:
          RUN_REAL_S3_TESTS: "true"
          AWS_REGION: us-east-1
          S3_BUCKET: techsara-chatgpt
          TEST_S3_PREFIX: ${{ inputs.test_s3_prefix }}
        run: pytest -q tests/integration/test_real_s3.py
