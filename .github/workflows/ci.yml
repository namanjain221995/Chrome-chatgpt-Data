name: CI

on:
  pull_request:
    branches: [main]
  # Called by deploy.yml (push to main) and release.yml (tag), so validation
  # always runs for the exact commit being deployed or released, and a push to
  # main does not start a second, competing run of the same jobs.
  workflow_call:
  workflow_dispatch:

# Scoped by calling workflow as well as ref: a CI run invoked by a deployment
# must never cancel, or be cancelled by, a run invoked by anything else.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI reads the repository and nothing else. It never needs a
# production secret, and pull requests therefore cannot reach one.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  # Locally built, never pushed to a registry: production builds the same
  # Dockerfile on the EC2 host (see docs/DECISIONS.md).
  IMAGE_NAME: techsara-chat-archive-backend

jobs:
  backend:
    name: Backend lint, format, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - name: Install backend
        working-directory: services/backend
        run: pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: services/backend
        run: ruff check app tests
      - name: Ruff format check
        working-directory: services/backend
        run: ruff format --check app tests
      - name: mypy
        working-directory: services/backend
        env:
          ENVIRONMENT: test
        run: mypy app
      - name: Unit tests
        working-directory: services/backend
        env:
          ENVIRONMENT: test
          AWS_REGION: us-east-1
          S3_BUCKET: techsara-chatgpt
        run: pytest -q -m "not integration and not real_s3" --cov=app --cov-report=term-missing

  extension:
    name: Extension lint, types, tests and deterministic build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/chrome-extension/package-lock.json
      - name: Install extension
        working-directory: apps/chrome-extension
        run: npm ci --no-audit --no-fund
      - name: Lint
        working-directory: apps/chrome-extension
        run: npm run lint
      - name: Typecheck
        working-directory: apps/chrome-extension
        run: npm run typecheck
      - name: Unit and DOM-fixture tests
        working-directory: apps/chrome-extension
        run: npm run test
      - name: Build and validate Manifest V3
        working-directory: apps/chrome-extension
        run: |
          npm run build
          npm run validate:manifest
          npm run validate:schemas
      - name: Package twice and compare
        working-directory: apps/chrome-extension
        env:
          EXTENSION_ARTIFACT_ID: ${{ github.sha }}
        run: |
          npm run package
          first="$(sha256sum ../../artifacts/*.zip | awk '{print $1}')"
          npm run package >/dev/null
          second="$(sha256sum ../../artifacts/*.zip | awk '{print $1}')"
          test "$first" = "$second"
          echo "reproducible extension package: $first"
      - name: Assert the package carries no secret or source map
        run: bash scripts/verify_extension_package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: techsara-chatgpt-extension-${{ github.sha }}
          path: |
            artifacts/techsara-chatgpt-extension-*.zip
            artifacts/techsara-chatgpt-extension-*.zip.sha256
          retention-days: 30
          if-no-files-found: error

  database:
    name: PostgreSQL integration, migrations and restore
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: techsara_app
          POSTGRES_PASSWORD: devonly_change_me
          POSTGRES_DB: techsara_chat_archive
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U techsara_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DEV_AUTH_ENABLED: "true"
      BROWSER_CONTENT_CAPTURE_ENABLED: "true"
      OPENAI_WRITTEN_AUTHORIZATION_CONFIRMED: "true"
      MANAGED_WORKSPACE_LABEL: "TechSara's Workspace"
      ALLOWED_EMAIL_DOMAINS: example.com
      OIDC_CLIENT_ID: test-client-id
      OIDC_REQUIRED_HD: example.com
      AWS_REGION: us-east-1
      S3_BUCKET: techsara-chatgpt
      DATABASE_URL: postgresql+asyncpg://techsara_app:devonly_change_me@localhost:5432/techsara_chat_archive
      TEST_DATABASE_URL: postgresql+asyncpg://techsara_app:devonly_change_me@localhost:5432/techsara_chat_archive
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - name: Install backend
        working-directory: services/backend
        run: pip install -e ".[dev]"
      - name: Empty-database upgrade and model drift check
        working-directory: services/backend
        run: |
          alembic upgrade head
          alembic check
      - name: Integration tests (jobs, ingest, governance, worker)
        working-directory: services/backend
        run: pytest -q -m integration
      - name: Downgrade and re-upgrade
        working-directory: services/backend
        run: |
          alembic downgrade -1
          alembic upgrade head
          alembic check
      - name: Backup and restore round trip
        run: |
          PGPASSWORD=devonly_change_me pg_dump -h localhost -U techsara_app \
            -d techsara_chat_archive -Fc > /tmp/archive.dump
          test -s /tmp/archive.dump
          PGPASSWORD=devonly_change_me createdb -h localhost -U techsara_app restore_check
          PGPASSWORD=devonly_change_me pg_restore -h localhost -U techsara_app \
            -d restore_check --no-owner /tmp/archive.dump
          tables="$(PGPASSWORD=devonly_change_me psql -h localhost -U techsara_app \
            -d restore_check -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")"
          test "$tables" -ge 25

  images-and-compose:
    name: Docker build, Compose topology and stack smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: services/backend
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:local
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as a non-root user with a matching pg_dump
        run: |
          test "$(docker run --rm --entrypoint id "$IMAGE_NAME:local" -u)" != "0"
          major="$(docker run --rm --entrypoint pg_dump "$IMAGE_NAME:local" --version | awk '{print $3}' | cut -d. -f1)"
          test "$major" = "16"
      - name: Compose topology and production exposure guards
        run: |
          docker compose -f compose.yaml config --quiet
          bash scripts/verify_production_config.sh
      - name: Shell syntax, shellcheck and workflow lint
        run: make lint-shell lint-workflows
      - name: Deployment script behaviour
        run: bash tests/integration/deploy_scripts_test.sh
      - name: Production Compose smoke (tunnel topology, secrets, private pgAdmin)
        run: bash tests/integration/production_compose_smoke_test.sh
      - name: Development Compose smoke (migrations, ingest, restart, restore)
        run: bash tests/integration/compose_smoke_test.sh
      - name: Short k6 ingestion load smoke
        run: bash tests/load/run_smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-test-report
          path: |
            artifacts/load-test-report.md
            artifacts/load-test-summary.json
          retention-days: 14
          if-no-files-found: ignore

  schemas:
    name: Shared schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/chrome-extension/package-lock.json
      - run: pip install -e "services/backend[dev]"
      - run: npm ci --no-audit --no-fund
        working-directory: apps/chrome-extension
      - name: Regenerate and compare
        env:
          ENVIRONMENT: test
        run: |
          python scripts/generate_schemas.py
          git diff --exit-code -- packages/schemas
      - run: node scripts/validate-schemas.mjs
        working-directory: apps/chrome-extension

  security:
    name: Secrets, dependencies and prohibited technology
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repository policy checks
        run: |
          bash scripts/verify_removed_technologies.sh
          bash scripts/verify_no_prohibited_aws_services.sh
          bash scripts/secret_scan.sh
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - name: Python dependency audit
        working-directory: services/backend
        run: |
          pip install -e ".[dev]"
          pip-audit --local --skip-editable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/chrome-extension/package-lock.json
      - name: Node dependency audit
        working-directory: apps/chrome-extension
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high --omit=dev

  docs:
    name: Documentation completeness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Required documents exist and say what they must say
        run: bash scripts/docs_check.sh
