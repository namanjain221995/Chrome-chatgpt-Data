name: Deploy to production

# main is the only branch that deploys, and only after the full CI suite has
# passed for the exact commit being deployed. Pull requests never reach this
# workflow, so a fork can never obtain a deployment secret.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA to deploy (defaults to HEAD of main)
        required: false
        type: string

# Never cancel a deployment in flight: it could interrupt a migration or leave
# containers half recreated. A second push queues behind the first instead.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Full validation of this exact commit. Deployment depends on it, so a red
  # test suite blocks the release rather than being reported after the fact.
  validate:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Deploy over SSH
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - uses: actions/checkout@v7

      - name: Resolve the deployment commit
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          PUSHED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          sha="${REQUESTED_SHA:-${PUSHED_SHA}}"
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'${sha}' is not a full 40-character commit SHA" >&2
            exit 1
          fi
          # A dispatched SHA must actually be an ancestor of main: this is what
          # stops an arbitrary commit from being deployed by hand.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${sha}" origin/main; then
            echo "::error::${sha} is not on origin/main" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "deploying ${sha}"

      - name: Configure SSH
        uses: ./.github/actions/ec2-ssh
        with:
          host: ${{ secrets.EC2_HOST }}
          user: ${{ secrets.EC2_USER }}
          port: ${{ secrets.EC2_SSH_PORT }}
          private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          host-key: ${{ vars.EC2_SSH_HOST_KEY || secrets.EC2_SSH_HOST_KEY }}

      # A deployment must not be attempted before the external configuration
      # exists. Missing SSM parameters or a missing tunnel token are reported as
      # a skip with the exact list of what to create, not as a red build: the
      # commit is fine, the environment is not ready yet.
      - name: Preflight the instance
        id: preflight
        run: |
          set -Eeuo pipefail
          set +e
          ssh ec2 'bash -Eeuo pipefail -s' <<'REMOTE' | tee /tmp/preflight.txt
          app_dir=/opt/techsara-chat-archive
          fatal=0
          notready=0

          [ -d "${app_dir}/.git" ] || { echo "FATAL ${app_dir} is not a git checkout"; fatal=1; }
          sudo -n true 2>/dev/null || { echo "FATAL deployment user needs passwordless sudo"; fatal=1; }
          sudo docker info >/dev/null 2>&1 || { echo "FATAL Docker is not usable"; fatal=1; }
          command -v aws >/dev/null 2>&1 || { echo "FATAL the AWS CLI is not installed"; fatal=1; }

          # The tunnel token is what makes the archive publicly reachable. It is
          # deliberately NOT in the core list: without it the stack can still be
          # deployed and run internally, so a missing tunnel downgrades the
          # deployment instead of blocking it.
          tunnel=1

          if command -v aws >/dev/null 2>&1; then
            aws sts get-caller-identity --region us-east-1 >/dev/null 2>&1 \
              || { echo "NOTREADY the EC2 instance role is not usable"; notready=1; }
            for name in postgres_password postgres_user postgres_db jwt_secret \
                        config_signing_key public_base_url \
                        oidc_client_id oidc_required_hd allowed_email_domains \
                        managed_workspace_label; do
              # Names only: no value is ever read here, decrypted or printed.
              aws ssm get-parameter --name "/techsara-chat-archive/${name}" \
                --region us-east-1 --query 'Parameter.Name' --output text >/dev/null 2>&1 \
                || { echo "NOTREADY missing SSM parameter /techsara-chat-archive/${name}"; notready=1; }
            done
            aws ssm get-parameter --name /techsara-chat-archive/cloudflare_tunnel_token \
              --region us-east-1 --query 'Parameter.Name' --output text >/dev/null 2>&1 \
              || { echo "NOTUNNEL no cloudflare_tunnel_token yet; deploying without public ingress"; tunnel=0; }
          fi

          [ -d /srv/techsara-chat-archive ] \
            || { echo "NOTREADY /srv/techsara-chat-archive is missing; run scripts/prepare_server_storage.sh"; notready=1; }

          echo "HOST $(hostname)"
          echo "FATAL_COUNT ${fatal}"
          echo "NOTREADY_COUNT ${notready}"
          echo "TUNNEL ${tunnel}"
          REMOTE
          ssh_status=$?
          set -e

          if [ "${ssh_status}" -ne 0 ] || ! grep -q '^FATAL_COUNT ' /tmp/preflight.txt; then
            echo "::error::could not complete the preflight over SSH"
            exit 1
          fi
          if [ "$(sed -n 's/^FATAL_COUNT //p' /tmp/preflight.txt)" != "0" ]; then
            grep '^FATAL ' /tmp/preflight.txt | sed 's/^FATAL /::error::/'
            exit 1
          fi
          if [ "$(sed -n 's/^NOTREADY_COUNT //p' /tmp/preflight.txt)" != "0" ]; then
            grep '^NOTREADY ' /tmp/preflight.txt | sed 's/^NOTREADY /::warning::/'
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "The instance is reachable but not configured yet; skipping the deployment."
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [ "$(sed -n 's/^TUNNEL //p' /tmp/preflight.txt)" = "1" ]; then
            echo "tunnel=true" >> "$GITHUB_OUTPUT"
            echo "preflight passed; deploying with public ingress"
          else
            # Deploy anyway: the backend runs, it is simply not yet reachable
            # from the internet. Adding the token later upgrades it automatically.
            grep '^NOTUNNEL ' /tmp/preflight.txt | sed 's/^NOTUNNEL /::warning::/'
            echo "tunnel=false" >> "$GITHUB_OUTPUT"
            echo "preflight passed; deploying WITHOUT public ingress"
          fi

      # Bring the checkout to the deployed commit before running anything from
      # it. Without this the instance runs the *previous* release's deployment
      # script, so a fix to that script can never apply itself -- a broken
      # deploy script would be unfixable through the pipeline.
      - name: Sync the checkout to the deployed commit
        if: steps.preflight.outputs.ready == 'true'
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -Eeuo pipefail
          # shellcheck disable=SC2087
          ssh ec2 'sudo bash -Eeuo pipefail -s' <<REMOTE
          cd /opt/techsara-chat-archive
          git config --global --add safe.directory /opt/techsara-chat-archive 2>/dev/null || true
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' --tags
          git cat-file -e '${DEPLOY_SHA}^{commit}'
          git reset --hard '${DEPLOY_SHA}'
          chmod +x scripts/*.sh
          echo "checkout is at \$(git rev-parse HEAD)"
          REMOTE

      - name: Deploy
        id: deploy
        if: steps.preflight.outputs.ready == 'true'
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          ACTOR: ${{ github.actor }}
          WITH_TUNNEL: ${{ steps.preflight.outputs.tunnel }}
        run: |
          set -Eeuo pipefail
          # Reduced to a safe character set before it is interpolated into the
          # remote script; the SHA was already validated as 40 hex characters.
          safe_actor="$(printf '%s' "${ACTOR}" | tr -cd 'A-Za-z0-9._-' | head -c 64)"

          # The script does the work on the instance: it takes the deployment
          # lock, records the rollback target, renders configuration from SSM,
          # migrates, recreates services, health-checks and rolls back on
          # failure. Nothing secret crosses this connection.
          #
          # Without a tunnel token the backend is still deployed and verified;
          # it simply has no public ingress until the token exists.
          deploy_flags=""
          if [ "${WITH_TUNNEL}" != "true" ]; then
            deploy_flags="--without-tunnel"
          fi

          # The here-document delimiter is deliberately unquoted: these values
          # must be substituted here, by the runner, because the instance has no
          # idea which commit was pushed. All three are constrained above.
          # shellcheck disable=SC2087
          ssh ec2 'sudo bash -Eeuo pipefail -s' <<REMOTE
          export DEPLOY_ACTOR='${safe_actor}'
          exec /opt/techsara-chat-archive/scripts/deploy_production.sh ${deploy_flags} '${DEPLOY_SHA}'
          REMOTE

      - name: Verify the deployed host
        if: success() && steps.preflight.outputs.ready == 'true'
        run: |
          set -Eeuo pipefail
          ssh ec2 'sudo /opt/techsara-chat-archive/scripts/verify_production.sh' | tee /tmp/verify.txt

      - name: Read back the recorded release
        if: always() && steps.preflight.outputs.ready == 'true'
        run: |
          set -Eeuo pipefail
          ssh ec2 'cat /opt/techsara-chat-archive/deploy/current-release 2>/dev/null || true' \
            > /tmp/current-release.txt || true
          cat /tmp/current-release.txt || true

      - name: Deployment summary
        if: always()
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          READY: ${{ steps.preflight.outputs.ready }}
          WITH_TUNNEL: ${{ steps.preflight.outputs.tunnel }}
          RESULT: ${{ steps.deploy.outcome }}
        run: |
          {
            echo "## Production deployment"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Requested commit | \`${DEPLOY_SHA}\` |"
            echo "| Instance configured | ${READY:-unknown} |"
            echo "| Public ingress | $([ "${WITH_TUNNEL}" = "true" ] && echo "Cloudflare Tunnel" || echo "none yet") |"
            echo "| Deploy step | ${RESULT:-skipped} |"
            echo "| Triggered by | ${{ github.actor }} |"
            echo "| Event | ${{ github.event_name }} |"
            echo

            if [ "${READY}" != "true" ]; then
              echo "### Deployment skipped"
              echo
              echo "The commit passed CI, but the instance is not configured yet."
              echo "Nothing on the host was changed. Outstanding items:"
              echo
              echo '```'
              grep '^NOTREADY ' /tmp/preflight.txt 2>/dev/null | sed 's/^NOTREADY /- /' \
                || echo "see the preflight step output"
              echo '```'
              echo
              echo "See docs/CLOUDFLARE_TUNNEL_SETUP.md and docs/GITHUB_SECRETS.md,"
              echo "then re-run this workflow."
            else
              if [ "${WITH_TUNNEL}" != "true" ]; then
                echo "### Deployed without public ingress"
                echo
                echo "The backend is running and verified on the instance, but it is"
                echo "not reachable from the internet: no Cloudflare tunnel token is"
                echo "in SSM yet. Add it and the next deployment upgrades itself."
                echo "See docs/CLOUDFLARE_TUNNEL_SETUP.md."
                echo
              fi
              echo "### Recorded release on the instance"
              echo '```'
              cat /tmp/current-release.txt 2>/dev/null || echo "unavailable"
              echo '```'
              if [ -s /tmp/verify.txt ]; then
                echo
                echo "### Host verification"
                echo '```'
                cat /tmp/verify.txt
                echo '```'
              fi
              echo
              echo "Application images roll back automatically when a health check fails."
              echo "Database migrations are never reversed automatically: see docs/ROLLBACK.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
