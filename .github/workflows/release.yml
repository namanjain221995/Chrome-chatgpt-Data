name: Release

# Tagging a version publishes the Chrome extension package that IT uploads to
# Chrome Enterprise, plus its checksum. No container image is published: the
# backend image is built on the EC2 host from the deployed commit, so a
# registry would add a credential without adding a guarantee
# (see docs/DECISIONS.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release for
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Package the extension and publish the release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve the release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -Eeuo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/chrome-extension/package-lock.json

      - name: Build and package the extension
        id: package
        working-directory: apps/chrome-extension
        env:
          EXTENSION_ARTIFACT_ID: ${{ steps.meta.outputs.tag }}
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npm run validate:manifest
          npm run validate:schemas
          npm run package
          zip="$(ls ../../artifacts/techsara-chatgpt-extension-*.zip)"
          sha="$(awk '{print $1}' "${zip}.sha256")"
          echo "zip=${zip}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"

      - name: Assert the package carries no secret or source map
        run: bash scripts/verify_extension_package.sh

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/techsara-chatgpt-extension-*.zip
            artifacts/techsara-chatgpt-extension-*.zip.sha256
          body: |
            ## TechSara Managed ChatGPT Session Archive — ${{ steps.meta.outputs.tag }}

            **Commit:** `${{ steps.meta.outputs.sha }}`
            **Extension SHA-256:** `${{ steps.package.outputs.sha256 }}`

            ### Deploying the backend
            Production deploys automatically from `main` over SSH. To deploy this
            exact commit by hand, run the *Deploy to production* workflow with:

            ```
            sha = ${{ steps.meta.outputs.sha }}
            ```

            ### Chrome Enterprise
            Upload the attached ZIP to the Chrome Web Store as a private listing,
            or host it for force-install. Verify the SHA-256 above before
            publishing; the build is reproducible, so the same commit always
            produces the same digest.

            Browser content capture stays disabled until both
            `BROWSER_CONTENT_CAPTURE_ENABLED` and
            `OPENAI_WRITTEN_AUTHORIZATION_CONFIRMED` are true on the server.
