name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  build:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      extension_sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: meta
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"

      # --- Extension --------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/chrome-extension/package-lock.json

      - name: Build and package the extension
        id: package
        working-directory: apps/chrome-extension
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run validate:manifest
          npm run package
          sha="$(awk '{print $1}' ../../artifacts/*.zip.sha256)"
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"

      # --- Deployment bundle ------------------------------------------------
      - name: Build the deployment bundle
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: bash scripts/deploy_bundle.sh

      # --- Container image --------------------------------------------------
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: services/backend
          push: true
          # Immutable digest-pinned tags: the git SHA is what gets deployed and
          # what a rollback refers to.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.release_tag }}
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.image_tag }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Release ----------------------------------------------------------
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.zip.sha256
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
          body: |
            ## TechSara Managed ChatGPT Session Archive

            **Image:** `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}`
            **Extension SHA-256:** `${{ steps.package.outputs.sha256 }}`

            ### Deploying
            ```bash
            aws ssm send-command \
              --document-name techsara-chat-archive-deploy \
              --targets Key=instanceids,Values=<instance-id> \
              --parameters imageTag=${{ steps.meta.outputs.image_tag }}
            ```

            ### Chrome Enterprise
            Upload the extension ZIP to the Chrome Web Store (private listing) or
            host it for force-install. Verify the SHA-256 above before publishing.

            Capture stays disabled until `BROWSER_CONTENT_CAPTURE_ENABLED` and
            `OPENAI_WRITTEN_AUTHORIZATION_CONFIRMED` are both true on the server.
